<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DCODETIERS — Rankings</title>
<style>
@font-face{font-family:Geist;src:url('https://mctiers.net/_next/static/media/Geist_Variable-s.p.f19e4721.woff2')} 
:root{color-scheme:dark;--bg:#10151c;--panel:#141b25;--panel2:#171f2b;--line:#202a37;--muted:#61748d;--text:#d5e0f0;--blue:#8fb5e5}
*{box-sizing:border-box}html{background:var(--bg)}body{margin:0;background:var(--bg);color:var(--text);font-family:Geist,Inter,system-ui,sans-serif;min-height:100vh}
.topbar{height:60px;max-width:1352px;margin:29px auto 0;border:2px solid #1c2633;border-radius:15px;background:#121923;display:flex;align-items:center;padding:0 16px;gap:24px}
.brand{width:300px;display:flex;align-items:center}.brand img{width:145px;height:44px;object-fit:contain;object-position:left center}
nav{display:flex;align-items:center;gap:14px;margin:auto}nav a{display:flex;align-items:center;gap:9px;text-decoration:none;color:#a9bfdc;font-size:16px;white-space:nowrap}nav img{width:23px;height:23px;object-fit:contain}nav a:hover{color:#fff}
.search{width:192px;height:38px;border-radius:24px;background:#1a2432;display:flex;align-items:center;padding:0 10px;gap:8px;color:#8192aa}.search input{width:100%;background:none;border:0;outline:0;color:#dbe7f7;font:inherit;font-size:14px}.search kbd{font-size:11px;padding:3px 7px;border-radius:7px;background:#222e3e}
main{max-width:1352px;margin:104px auto 0;position:relative}.tabs{position:absolute;left:0;bottom:100%;display:flex;gap:4px;overflow-x:auto;width:100%;scrollbar-width:none}.tab{height:56px;width:105px;flex:0 0 105px;border:2px solid #1d2835;border-bottom:0;border-radius:24px 24px 0 0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-decoration:none;color:#52657e;font-weight:700;font-size:14px;background:#111821}.tab img{width:25px;height:25px;object-fit:contain}.tab.active{background:#1a2534;color:#eef4fc;border-color:#1d2835;position:relative}.tab.active:after{content:"";position:absolute;bottom:0;left:0;width:100%;height:2px;background:#f2f5fa}
.panel{background:#121923;border:2px solid #1e2937;border-radius:0 14px 14px 14px;padding:14px 30px 28px;min-height:600px}
.actions{height:38px;display:flex;align-items:center;justify-content:flex-end;gap:18px;margin-bottom:15px}.info{background:#202c3d;color:#e4edf8;border:0;border-radius:8px;height:34px;padding:0 13px;font-weight:650;font-size:13px}.server{display:flex;align-items:center;gap:9px}.server>img{width:40px;height:40px;object-fit:contain}.server small{display:block;color:#7e94af;font-size:10px;font-weight:800;line-height:1.2}.ip{background:#202c3d;border-radius:5px;padding:4px 7px;color:#e1eafa;font-size:11px;font-weight:700}
.labels{height:34px;display:grid;grid-template-columns:150px minmax(260px,1fr) 68px 340px;align-items:center;padding:0 13px;color:#26364b;text-transform:uppercase;font-size:13px;font-weight:800;letter-spacing:.02em}.labels span:first-child{padding-left:0}.labels span:nth-child(3){text-align:center}.labels span:last-child{text-align:center}
.player{height:74px;border:2px solid #202a37;border-radius:13px;background:#161e29;margin:8px 0;display:grid;grid-template-columns:150px minmax(260px,1fr) 68px 340px;align-items:center;transition:background .15s,transform .15s;overflow:hidden}.player:hover{background:#1b2736;transform:translateX(-5px)}
.identity{display:contents}.placement{grid-column:1;grid-row:1;height:54px;width:148px;position:relative;display:flex;align-items:center;overflow:hidden;flex-shrink:0}.placement .shine{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.placement b{position:absolute;left:9px;bottom:0;font-size:34px;font-style:italic;line-height:1;color:#fff;text-shadow:0 3px 2px #222;z-index:2}.skin{position:absolute;width:60px;height:60px;object-fit:contain;right:20px;bottom:-2px;z-index:1;filter:drop-shadow(-4px -2px 1px #0008)}
.playername{min-width:0;grid-column:2;grid-row:1;padding-left:10px;align-self:center;overflow:visible}.playername strong{display:block;font-size:21px;line-height:1.25;font-weight:750;color:#d5e2f3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.subtitle{display:flex;align-items:center;gap:5px;color:#92a9c6;font-size:14px;white-space:nowrap}.subtitle img{width:20px;height:20px;object-fit:contain}.points{color:#526a88}
.region{grid-column:3;grid-row:1;height:100%;display:flex;align-items:center;justify-content:center;background:#10172266}.region span{width:38px;height:38px;border-radius:9px;display:grid;place-items:center;font-size:17px;font-weight:850}.region .na{background:#4a2029;color:#ff6473}.region .eu{background:#174528;color:#62f28a}.region .as{background:#44341c;color:#ffcf70}.region .sa{background:#1a374d;color:#6ec6ff}
.tierlist{grid-column:4;grid-row:1;display:flex;align-items:center;justify-content:center;gap:0;height:100%;padding:0 2px}.tier{width:39px;height:54px;position:relative;display:flex;justify-content:center;flex-shrink:0}.tiericon{position:absolute;top:2px;width:30px;height:30px;border-radius:50%;background:#05090f;border:2px solid #394858;display:grid;place-items:center;overflow:hidden}.tiericon img{width:19px;height:19px;object-fit:contain}.tier em{position:absolute;bottom:0;left:50%;transform:translateX(-50%);font-style:normal;font-size:12px;line-height:17px;height:18px;min-width:34px;text-align:center;border-radius:7px;font-weight:800;color:#ffd05d;background:#554126}.tier.ht3 .tiericon{border-color:#985321}.tier.ht3 em,.tier.lt3 em{background:#985321;color:#ffc18d}.tier.lt3 .tiericon{border-color:#754d7e}.tier.lt3 em{background:#60466f;color:#d6b7ef}.tier.ht2 em{background:#253e5c;color:#b8d9ff}.tier.lt2 em{background:#28394b;color:#c0d1e5}.empty{width:34px;height:30px;border:2px dashed #3a4b60;border-radius:50%;opacity:.8;margin:0 4px}
@media(max-width:1400px){.topbar,main{margin-left:24px;margin-right:24px}.brand{width:230px}}
@media(max-width:900px){.topbar{margin:14px 12px 0}.brand{width:auto}.brand img{width:120px}nav{display:none}.search{margin-left:auto;width:180px}main{margin:100px 12px 0}.panel{padding:12px}.labels{display:none}.player{height:auto;min-height:74px;grid-template-columns:minmax(0,1fr) 54px;grid-template-rows:auto auto;padding:5px}.identity{display:contents}.placement{grid-column:1;grid-row:1;width:110px}.playername{grid-column:1;grid-row:1;padding-left:118px;max-width:calc(100vw - 110px)}.region{grid-column:2;grid-row:1}.tierlist{grid-column:1 / -1;grid-row:2;justify-content:flex-start;padding-left:8px;overflow-x:auto}.placement{width:110px}.playername strong{font-size:18px}.subtitle{font-size:12px}.actions{margin-bottom:12px}.tab{width:85px;flex-basis:85px}}
@media(max-width:500px){.brand img{width:100px}.search{width:145px}.panel{padding:9px}.placement{width:86px}.placement b{font-size:28px}.skin{right:5px;width:54px;height:54px}.tier{width:36px}.server>img{width:30px}.info{padding:0 9px}}

/* Smooth, clean motion layered over the original design */
html{scroll-behavior:smooth}
.topbar,.panel{animation:softEnter .65s cubic-bezier(.2,.75,.25,1) both}
.topbar{animation-delay:.04s}
.panel{animation-delay:.12s}
.tab{transition:color .22s ease,background .22s ease,border-color .22s ease,transform .22s ease}
.tab:hover{color:#eaf2ff;transform:translateY(-3px)}
.tab.active{box-shadow:0 -5px 18px #0002}
.player{will-change:transform,opacity,border-color,box-shadow;transition:background .22s ease,transform .22s cubic-bezier(.2,.8,.2,1),border-color .22s ease,box-shadow .22s ease;animation:playerEnter .48s cubic-bezier(.2,.75,.25,1) both;animation-delay:calc(var(--row-index, 0) * 38ms)}
.player:hover{background:#1c2939;transform:translateY(-3px) scale(1.008);border-color:#35465b;box-shadow:0 10px 24px #0003}
.player:active{transform:translateY(-1px) scale(1.002)}
.tier{transition:transform .2s ease,filter .2s ease}
.player:hover .tier{filter:brightness(1.12)}
.player:hover .tier:nth-child(odd){transform:translateY(-2px)}
.player:hover .tier:nth-child(even){transform:translateY(2px)}
.skin{transition:transform .28s ease,filter .28s ease}
.player:hover .skin{transform:scale(1.07) translateY(-2px);filter:drop-shadow(-4px -3px 4px #0009)}
@keyframes softEnter{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes playerEnter{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important;transition-duration:.01ms!important}}

/* Player profile modal */
.profile-overlay{position:fixed;inset:0;z-index:1000;display:flex;align-items:center;justify-content:center;padding:18px;background:rgba(3,7,12,.76);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);opacity:0;visibility:hidden;transition:opacity .24s ease,visibility .24s ease}
.profile-overlay.open{opacity:1;visibility:visible}
.profile-modal{position:relative;width:min(100%,540px);max-height:min(92vh,760px);overflow:auto;background:#121923;border:1px solid #263446;border-radius:24px;padding:28px 30px 30px;box-shadow:0 28px 90px #0009;transform:translateY(18px) scale(.975);opacity:0;transition:transform .32s cubic-bezier(.2,.8,.2,1),opacity .26s ease;scrollbar-width:thin;scrollbar-color:#34465d transparent}
.profile-overlay.open .profile-modal{transform:translateY(0) scale(1);opacity:1}
.profile-close{position:absolute;right:18px;top:18px;width:46px;height:46px;border:0;border-radius:50%;background:#202c3d;color:#c8d5e6;font-size:30px;line-height:1;cursor:pointer;transition:background .2s,transform .2s}
.profile-close:hover{background:#2b3b50;transform:rotate(90deg)}
.profile-head{display:flex;flex-direction:column;align-items:center;text-align:center;padding:14px 0 8px}
.profile-avatar{width:112px;height:112px;object-fit:contain;border-radius:50%;border:2px solid #8292a8;background:#1b2635;box-shadow:0 8px 24px #0005}
.profile-name{margin:7px 0 12px;font-size:29px;line-height:1.2;font-weight:800;color:#e3edf9;overflow-wrap:anywhere}
.profile-role{display:flex;align-items:center;gap:9px;padding:8px 14px;border-radius:22px;background:#4b482b;color:#ffdc4c;font-weight:750;font-size:16px}
.profile-role img{width:23px;height:23px;object-fit:contain}
.profile-region{margin-top:16px;color:#9bb0cc;font-size:19px;font-weight:700}
.profile-links{display:flex;gap:9px;justify-content:center;flex-wrap:wrap;margin:10px 0 20px}
.profile-links a{display:flex;align-items:center;gap:7px;text-decoration:none;color:#9eb5d2;background:#202c3d;padding:9px 12px;border-radius:13px;font-size:13px;transition:background .2s,transform .2s}
.profile-links a:hover{background:#2a3a50;transform:translateY(-2px)}
.profile-section{margin-top:18px}
.profile-section-title{margin:0 0 10px;color:#9bb0cc;font-size:21px;font-weight:500;text-transform:uppercase}
.profile-position{display:flex;align-items:center;gap:12px;min-height:50px;border:2px solid #29384b;border-radius:12px;background:#161f2b;overflow:hidden;color:#e5eef9;font-size:19px;font-weight:750}
.profile-rank{display:flex;align-items:center;justify-content:center;align-self:stretch;min-width:94px;padding:0 12px;background:linear-gradient(110deg,#8ba3ae,#607b88);color:white;font-size:31px;font-style:italic;text-shadow:0 2px 3px #222;clip-path:polygon(0 0,100% 0,85% 100%,0 100%)}
.profile-position small{font-size:15px;color:#91a9c6;font-weight:500}
.profile-tier-grid{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:7px;padding:12px;border:2px solid #29384b;border-radius:12px;background:#161f2b}
.profile-tier{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.profile-tier-icon{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:#080d14;border:2px solid #394858}
.profile-tier-icon img{width:20px;height:20px;object-fit:contain}
.profile-tier em{font-style:normal;font-size:12px;line-height:18px;min-width:33px;text-align:center;border-radius:7px;font-weight:850;color:#ffd05d;background:#554126}
.profile-tier.ht3 .profile-tier-icon{border-color:#985321}.profile-tier.ht3 em,.profile-tier.lt3 em{background:#985321;color:#ffc18d}
.profile-tier.lt3 .profile-tier-icon{border-color:#754d7e}.profile-tier.lt3 em{background:#60466f;color:#d6b7ef}
.profile-tier.ht2 em{background:#253e5c;color:#b8d9ff}.profile-tier.lt2 em{background:#28394b;color:#c0d1e5}
@media(max-width:560px){.profile-modal{padding:22px 16px 22px;border-radius:19px}.profile-tier-grid{grid-template-columns:repeat(4,minmax(0,1fr))}.profile-name{font-size:25px}.profile-position{font-size:16px}.profile-rank{min-width:75px}}
@media(prefers-reduced-motion:reduce){.profile-overlay,.profile-modal,.profile-close,.profile-links a{transition:none!important}}
</style>
</head>

const UUID_CACHE_STORAGE_KEY = 'mctiers_individual_uuid_cache_v2';
const UUID_CACHE_TTL_MS = 1000 * 60 * 60 * 24 * 7;

const uuidCacheByPlayer = new Map();
const activeRequestsByPlayer = new Map();

function normalizePlayerKey(name) {
  return String(name || '').trim().toLowerCase();
}

function formatUuid(rawUuid) {
  const clean = String(rawUuid || '').replace(/-/g, '').trim().toLowerCase();
  if (!/^[0-9a-f]{32}$/.test(clean)) return null;
  return `${clean.slice(0, 8)}-${clean.slice(8, 12)}-${clean.slice(12, 16)}-${clean.slice(16, 20)}-${clean.slice(20)}`;
}

function loadUuidCache() {
  for (const [key, uuid] of Object.entries(KNOWN_UUIDS_BY_NAME)) {
    const formatted = formatUuid(uuid);
    if (formatted) uuidCacheByPlayer.set(key, formatted);
  }
  try {
    const raw = localStorage.getItem(UUID_CACHE_STORAGE_KEY);
    if (!raw) return;
    const parsed = JSON.parse(raw);
    if (!parsed || typeof parsed !== 'object') return;
    const now = Date.now();
    for (const [key, entry] of Object.entries(parsed)) {
      if (entry && typeof entry === 'object' && now - entry.savedAt < UUID_CACHE_TTL_MS) {
        const formatted = formatUuid(entry.uuid);
        if (formatted) {
          uuidCacheByPlayer.set(key, formatted);
        } else if (entry.uuid === null) {
          uuidCacheByPlayer.set(key, null);
        }
      }
    }
  } catch (err) {
    console.warn('[UUID Cache] No se pudo leer localStorage:', err);
  }
}

function saveUuidCache() {
  try {
    const now = Date.now();
    const payload = {};
    for (const [key, uuid] of uuidCacheByPlayer.entries()) {
      payload[key] = { uuid, savedAt: now };
    }
    localStorage.setItem(UUID_CACHE_STORAGE_KEY, JSON.stringify(payload));
  } catch (err) {
    console.warn('[UUID Cache] No se pudo guardar localStorage:', err);
  }
}

function buildCraftyBustUrlForUuid(uuid) {
  const formatted = formatUuid(uuid);
  if (!formatted) return null;
  return `https://render.crafty.gg/3d/bust/${formatted}`;
}

function getIndividualSkinUrl(playerName) {
  const key = normalizePlayerKey(playerName);
  if (!key) return ERROR_PLACEHOLDER_URL;

  if (uuidCacheByPlayer.has(key)) {
    const cachedUuid = uuidCacheByPlayer.get(key);
    return cachedUuid ? buildCraftyBustUrlForUuid(cachedUuid) : ERROR_PLACEHOLDER_URL;
  }

  if (KNOWN_UUIDS_BY_NAME[key]) {
    const knownUuid = formatUuid(KNOWN_UUIDS_BY_NAME[key]);
    if (knownUuid) return buildCraftyBustUrlForUuid(knownUuid);
  }

  return ERROR_PLACEHOLDER_URL;
}

async function fetchUuidFromMojang(trimmedName) {
  const res = await fetch(`https://api.mojang.com/users/profiles/minecraft/${encodeURIComponent(trimmedName)}`);
  if (res.status === 404 || res.status === 204) {
    throw new Error(`Mojang API: jugador "${trimmedName}" no encontrado (${res.status})`);
  }
  if (!res.ok) {
    throw new Error(`Mojang API: error HTTP ${res.status} para "${trimmedName}"`);
  }
  const data = await res.json();
  const formatted = formatUuid(data && data.id);
  if (!formatted) {
    throw new Error(`Mojang API: UUID inválido para "${trimmedName}"`);
  }
  return formatted;
}

async function fetchUuidFromPlayerDb(trimmedName) {
  const res = await fetch(`https://playerdb.co/api/player/minecraft/${encodeURIComponent(trimmedName)}`);
  if (!res.ok) {
    throw new Error(`PlayerDB API: error HTTP ${res.status} para "${trimmedName}"`);
  }
  const data = await res.json();
  const rawId = data && data.success && data.data && data.data.player ? data.data.player.id : null;
  const formatted = formatUuid(rawId);
  if (!formatted) {
    throw new Error(`PlayerDB API: jugador "${trimmedName}" no encontrado`);
  }
  return formatted;
}

async function resolveIndividualPlayerUuid(playerName) {
  const trimmedName = String(playerName || '').trim();
  const key = normalizePlayerKey(trimmedName);

  if (!trimmedName || !/^[a-zA-Z0-9_]{1,16}$/.test(trimmedName)) {
    console.warn(`[UUID] Nombre inválido: "${playerName}"`);
    return null;
  }

  if (uuidCacheByPlayer.has(key)) {
    return uuidCacheByPlayer.get(key);
  }

  if (activeRequestsByPlayer.has(key)) {
    return activeRequestsByPlayer.get(key);
  }

  const individualPromise = (async () => {
    try {
      let resolvedUuid = null;
      try {
        resolvedUuid = await fetchUuidFromMojang(trimmedName);
      } catch (mojangErr) {
        try {
          resolvedUuid = await fetchUuidFromPlayerDb(trimmedName);
        } catch (fallbackApiErr) {
          if (KNOWN_UUIDS_BY_NAME[key]) {
            resolvedUuid = formatUuid(KNOWN_UUIDS_BY_NAME[key]);
          } else {
            console.warn(`[UUID] Falló la consulta para "${trimmedName}":`, mojangErr.message, '|', fallbackApiErr.message);
          }
        }
      }

      if (resolvedUuid) {
        uuidCacheByPlayer.set(key, resolvedUuid);
        saveUuidCache();
        return resolvedUuid;
      }

      uuidCacheByPlayer.set(key, null);
      saveUuidCache();
      return null;
    } finally {
      activeRequestsByPlayer.delete(key);
    }
  })();

  activeRequestsByPlayer.set(key, individualPromise);
  return individualPromise;
}

function updateDomSkinForPlayer(playerName, url) {
  const key = normalizePlayerKey(playerName);
  document.querySelectorAll('img[data-player-skin]').forEach(img => {
    if (img.dataset.playerSkin === key && img.src !== url) {
      img.src = url;
    }
  });
}

async function resolveSkinsForPlayers(playerList) {
  const uniqueNames = [...new Set(
    playerList.map(item => String(item.name || '').trim()).filter(Boolean)
  )];

  await Promise.all(uniqueNames.map(async name => {
    const uuid = await resolveIndividualPlayerUuid(name);
    const skinUrl = uuid ? buildCraftyBustUrlForUuid(uuid) : ERROR_PLACEHOLDER_URL;
    updateDomSkinForPlayer(name, skinUrl);
  }));
}

function tierClass(t) {
  return String(t).toLowerCase();
}

function getTierPoints(tier) {
  const normalizedTier = String(tier || '').trim().toUpperCase();
  return Object.prototype.hasOwnProperty.call(tierPointsMap, normalizedTier)
    ? tierPointsMap[normalizedTier]
    : 0;
}

function normalizeTiers(rawTiers) {
  if (!rawTiers) return [];
  if (Array.isArray(rawTiers)) {
    return rawTiers.filter(([, tier]) => typeof tier === 'string' && tier.trim() !== '');
  }
  return modeKeys
    .filter(mode => typeof rawTiers[mode] === 'string' && rawTiers[mode].trim() !== '')
    .map(mode => [mode, rawTiers[mode].trim()]);
}

function calculateTotalPoints(tierEntries) {
  return tierEntries.reduce((sum, [, tier]) => sum + getTierPoints(tier), 0);
}

function getOverallRankedPlayers() {
  return players
    .map((player, sourceIndex) => {
      const tierEntries = normalizeTiers(player.tiers);
      return {
        ...player,
        sourceIndex,
        tierEntries,
        points: calculateTotalPoints(tierEntries)
      };
    })
    .sort((a, b) => b.points - a.points || a.sourceIndex - b.sourceIndex)
    .map((player, index) => ({
      ...player,
      overallRank: index + 1,
      rank: String(index + 1)
    }));
}

function getModeRankedPlayers(mode) {
  return getOverallRankedPlayers()
    .map(player => {
      const found = player.tierEntries.find(([m]) => m === mode);
      return found ? { ...player, modeTier: found[1] } : null;
    })
    .filter(Boolean)
    .sort((a, b) => {
      const aOrder = tierOrder.indexOf(a.modeTier);
      const bOrder = tierOrder.indexOf(b.modeTier);
      return (aOrder < 0 ? 999 : aOrder) - (bOrder < 0 ? 999 : bOrder)
        || b.points - a.points
        || a.overallRank - b.overallRank;
    })
    .map((player, index) => ({
      ...player,
      rank: String(index + 1)
    }));
}

let currentMode = 'overall';

function getCurrentRankingList() {
  const query = document.getElementById('search').value.trim().toLowerCase();
  const baseList = currentMode === 'overall'
    ? getOverallRankedPlayers()
    : getModeRankedPlayers(currentMode);

  if (!query) return baseList;
  return baseList.filter(player => player.name.toLowerCase().includes(query));
}

    <article class="player" style="--row-index:${index}" data-player-name="${encodeURIComponent(p.name)}" role="button" tabindex="0" aria-label="View ${p.name}'s profile">
      <div class="identity">
        <div class="placement"><img class="shine" src="${base}/placements/${p.rank}-shimmer.svg" onerror="this.style.opacity=0"><b>${p.rank}.</b><img class="skin" data-player-skin="${playerKey}" src="${skinSrc}" alt="${p.name} Minecraft skin" onerror="this.onerror=null;this.src='${ERROR_PLACEHOLDER_URL}'"></div>
        <div class="playername"><strong>${p.name}</strong><div class="subtitle"><img src="${base}/titles/combat_master.webp" alt=""><span>Combat Master</span><span class="points">(${p.points} points)</span></div></div>
      </div>
      <div class="region"><span class="${String(p.region).toLowerCase()}">${p.region}</span></div>
      <div class="tierlist">${p.tierEntries.map(([mode, t]) => `<div class="tier ${tierClass(t)}"><span class="tiericon"><img src="${base}/tier_icons/${mode}.svg?v=2" alt="${mode}"></span><em>${t}</em></div>`).join('')}<span class="empty"></span></div>
    </article>`;
  }).join('');

  playersContainer.querySelectorAll('.player').forEach(card => {
    const playerName = decodeURIComponent(card.dataset.playerName || '');
    const playerData = list.find(item => item.name === playerName);
    if (!playerData) return;
    card.style.cursor = 'pointer';
    card.addEventListener('click', () => openPlayerProfile(playerData));
    card.addEventListener('keydown', event => {
      if (event.key === 'Enter' || event.key === ' ') {
        event.preventDefault();
        openPlayerProfile(playerData);
      }
    });
  });

  resolveSkinsForPlayers(list);
}

function refreshRankings() {
  render(getCurrentRankingList());
}

document.getElementById('search').addEventListener('input', refreshRankings);
document.addEventListener('keydown', e => {
  if (e.key === '/' && document.activeElement.tagName !== 'INPUT') {
    e.preventDefault();
    document.getElementById('search').focus();
  }
});

document.querySelectorAll('#tabs .tab').forEach(tab => {
  tab.addEventListener('click', event => {
    event.preventDefault();
    currentMode = tab.dataset.mode;
    document.querySelectorAll('#tabs .tab').forEach(item => item.classList.remove('active'));
    tab.classList.add('active');
    refreshRankings();
  });
});

// Header navigation stays on this page; Rankings always returns to Overall.
document.querySelector('.brand').addEventListener('click', event => event.preventDefault());
document.querySelectorAll('nav a:not(#rankings-nav):not([href^="https://discord.gg/"])').forEach(link => {
  link.addEventListener('click', event => event.preventDefault());
});
document.getElementById('rankings-nav').addEventListener('click', event => {
  event.preventDefault();
  currentMode = 'overall';
  document.querySelectorAll('#tabs .tab').forEach(tab => {
    tab.classList.toggle('active', tab.dataset.mode === 'overall');
  });
  refreshRankings();
  document.getElementById('rankings').scrollIntoView({ behavior: 'smooth', block: 'start' });
});

// Interactive player profiles
const profileOverlay = document.getElementById('profile-overlay');
const profileContent = document.getElementById('profile-content');
const regionNames = { NA: 'North America', EU: 'Europe', AS: 'Asia', SA: 'South America' };

function openPlayerProfile(player) {
  const overallList = getOverallRankedPlayers();
  const overallEntry = overallList.find(item => item.name === player.name);
  const modePosition = currentMode === 'overall'
    ? (overallEntry ? overallEntry.overallRank : 1)
    : Number(player.rank) || 1;

  const playerKey = normalizePlayerKey(player.name);
  const skinSrc = getIndividualSkinUrl(player.name);

  const allTiers = player.tierEntries.map(([mode, tier]) => `
    <div class="profile-tier ${tierClass(tier)}">
      <span class="profile-tier-icon"><img src="${base}/tier_icons/${mode}.svg?v=2" alt="${mode}"></span>
      <em>${tier}</em>
    </div>`).join('');

  profileContent.innerHTML = `
    <div class="profile-head">
      <img class="profile-avatar" data-player-skin="${playerKey}" src="${skinSrc}" alt="${player.name} Minecraft skin" onerror="this.onerror=null;this.src='${ERROR_PLACEHOLDER_URL}'">
      <h2 class="profile-name" id="profile-name">${player.name}</h2>
      <div class="profile-role"><img src="${base}/titles/combat_master.webp" alt="">Combat Master</div>
      <div class="profile-region">${regionNames[player.region] || player.region}</div>
      <div class="profile-links">
        <a href="https://namemc.com/profile/${encodeURIComponent(player.name)}" target="_blank" rel="noopener noreferrer">◧ NameMC ↗</a>
        <a href="https://mctiers.net/players/${encodeURIComponent(player.name)}" target="_blank" rel="noopener noreferrer">View full profile ↗</a>
      </div>
    </div>
    <div class="profile-section">
      <h3 class="profile-section-title">Position</h3>
      <div class="profile-position">
        <span class="profile-rank">${modePosition}.</span>
        <span>🏆 ${currentMode === 'overall' ? 'OVERALL' : currentMode.toUpperCase()} <small>(${player.points} points)</small></span>
      </div>
    </div>
    <div class="profile-section">
      <h3 class="profile-section-title">Tiers</h3>
      <div class="profile-tier-grid">${allTiers || '<span>No tiers available</span>'}</div>
    </div>`;
  profileOverlay.classList.add('open');
  profileOverlay.setAttribute('aria-hidden', 'false');
  document.body.style.overflow = 'hidden';

  resolveSkinsForPlayers([player]);
}

function closePlayerProfile() {
  profileOverlay.classList.remove('open');
  profileOverlay.setAttribute('aria-hidden', 'true');
  document.body.style.overflow = '';
}

document.getElementById('profile-close').addEventListener('click', closePlayerProfile);
profileOverlay.addEventListener('click', event => {
  if (event.target === profileOverlay) closePlayerProfile();
});
document.addEventListener('keydown', event => {
  if (event.key === 'Escape' && profileOverlay.classList.contains('open')) closePlayerProfile();
});

refreshRankings();
</script>
</body>
</html>
